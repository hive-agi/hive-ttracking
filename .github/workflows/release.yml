name: release

# Patch-bump and publish only when the push actually changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on both Clojars and the private registry.
#
# TWO coordinates live in this repository:
#   io.github.hive-agi/hive-ttracking       (the root tree, tag v*)
#   io.github.hive-agi/hive-ttracking-time  (time/, tag time-v*)
# hive-build reads exactly ONE ./version.edn from the CWD, so each job runs
# clojure -T:build in its own directory. The tag prefixes differ on purpose:
# the root changelog generator discovers tags with `git tag --list "v*"`, so
# time-v* is invisible to it and the two streams never cross.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # version.edn decides what the jar carries (:src-dirs, :publish),
      # and VERSION is the release floor: both must be able to release.
      - 'version.edn'
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # A published pom is immutable, so the suite runs BEFORE anything
      # is minted. Without this step a red push straight to main still
      # deploys, and the bad version can never be replaced.
      - name: Run tests
        run: clojure -M:test

      # The release number comes from the tags, not from a commit back to main.
      # VERSION in the tree is a FLOOR (raise it in a staging PR to open a new
      # minor line); this run releases patch+1 of max(VERSION, newest v* tag).
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Tag only, no commit: a version-bump commit on main is one staging
          # lacks, and it made every next staging->main PR conflict in VERSION.
          # Annotated, so the next run's tag scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

  release-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # hive-build reads ./version.edn from the CWD: without this the time
        # job would publish the ROOT coordinate under time-v*.
        working-directory: time
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Run tests
        run: clojure -M:test

      # Patch+1 of max(time/VERSION, newest time-v* tag). The v* scan is
      # deliberately NOT used here: it would fold the root stream into this one.
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'time-v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^time-v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git tag -a "time-v$VER" -m "release time $VER"
          git push origin "refs/tags/time-v$VER"

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
